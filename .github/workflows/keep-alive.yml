name: Supabase keep-alive

# Second, independent trigger for /api/keep-alive so the Supabase project never
# reaches ~7 days of inactivity and gets paused. Runs even if the Vercel cron is
# disabled, reconfigured, or the plan changes.
#
# Note: GitHub disables scheduled workflows in a repository with no activity for
# 60 days and emails the owner. Push anything, or press "Run workflow", to
# re-enable it.

on:
  schedule:
    # 07:15 UTC every second day — deliberately offset from the Vercel cron.
    - cron: "15 7 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keep-alive endpoint
        env:
          # Optional: set these as repository secrets. APP_URL defaults to the
          # production domain, CRON_SECRET is only needed if the app sets it.
          APP_URL: ${{ secrets.APP_URL || 'https://glowgramshop.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -n "${CRON_SECRET}" ]; then
            auth_header="Authorization: Bearer ${CRON_SECRET}"
          else
            auth_header="X-Keep-Alive: github-actions"
          fi

          status=$(curl -sS -o response.txt -w '%{http_code}' \
            --max-time 30 --retry 3 --retry-delay 10 --retry-all-errors \
            -H "${auth_header}" \
            "${APP_URL}/api/keep-alive")

          echo "HTTP ${status}"
          cat response.txt

          if [ "${status}" != "200" ]; then
            echo "::error::Keep-alive ping failed with HTTP ${status}"
            exit 1
          fi
